- name: Build and push container image
  hosts: all
  gather_facts: true

  vars:
    ansible_python_interpreter: auto_silent
    staging_path: "{{ ansible_facts['user_dir'] }}/{{ staging_directory }}"

  tasks:
    - name: Build and push container image
      block:
        - name: Stage build context
          ansible.posix.synchronize:
            src: "{{ source_directory }}/"
            dest: "{{ staging_path }}/"
            delete: true
            checksum: true
            times: false
            rsync_opts:
              - "--mkpath"
              - "--exclude=.git"

        - name: Build container image
          containers.podman.podman_image:
            name: "{{ image_name }}"
            tag: "{{ image_tag }}"
            state: build
            path: "{{ staging_path }}"
            force: true
            build:
              file: "{{ staging_path }}/{{ containerfile }}"
              cache: "{{ not (no_cache | bool) }}"

        - name: Push container image
          containers.podman.podman_image:
            name: "{{ image_name }}:{{ image_tag }}"
            pull: false
            push: true
            username: "{{ lookup('env', 'REGISTRY_USERNAME') }}"
            password: "{{ lookup('env', 'REGISTRY_PASSWORD') }}"

      always:
        - name: Remove staged build context
          ansible.builtin.file:
            path: "{{ staging_path }}"
            state: absent
